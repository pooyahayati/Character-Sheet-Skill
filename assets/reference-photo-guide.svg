<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
<style>
  .bg{fill:#f2f0eb}.hdr{fill:#20262d}.h1{font:700 34px Arial,sans-serif;fill:#fff}.sub{font:400 17px Arial,sans-serif;fill:#d7dde3}
  .col{fill:#fff;stroke:#c9c5bd;stroke-width:2}.ct{font:700 26px Arial,sans-serif;fill:#222}.small{font:400 14px Arial,sans-serif;fill:#555}
  .req{fill:#eaf6ee;stroke:#7eaa88}.rec{fill:#fff7df;stroke:#c7a552}.body{fill:#eef4ff;stroke:#809bc7}
  .lab{font:700 15px Arial,sans-serif;fill:#222}.tag{font:700 12px Arial,sans-serif;fill:#555}
  .head{fill:#d7b49e}.hair{fill:#342a25}.torso{fill:#8b97a8}.line{stroke:#6a6a6a;stroke-width:5;stroke-linecap:round}
</style>
<rect width="1600" height="980" class="bg"/>
<rect width="1600" height="90" class="hdr"/>
<text x="34" y="42" class="h1">REFERENCE PHOTO GUIDE — BASE / ADVANCED / FULL</text>
<text x="34" y="70" class="sub">Show before intake · Missing required angles must be requested before generation</text>

<g transform="translate(30,120)">
  <rect width="500" height="810" rx="12" class="col"/>
  <text x="24" y="42" class="ct">BASE</text>
  <text x="24" y="68" class="small">Minimum reliable identity start</text>
  <g transform="translate(24,95)"><rect width="452" height="190" rx="10" class="req"/>
    <circle cx="105" cy="78" r="48" class="head"/><path d="M58 75 Q70 20 105 22 Q150 20 155 76 Q135 50 105 52 Q78 50 58 75" class="hair"/>
    <path d="M62 135 Q105 105 148 135 L160 178 L50 178Z" class="torso"/>
    <text x="190" y="55" class="lab">Front / near-front neutral face</text><text x="190" y="82" class="tag">REQUIRED</text>
    <text x="190" y="112" class="small">Sharp · eye-level · low distortion</text></g>
  <g transform="translate(24,310)"><rect width="452" height="145" rx="10" class="rec"/>
    <circle cx="90" cy="62" r="38" class="head"/><path d="M55 60 Q63 22 93 23 Q127 22 130 62" class="hair"/>
    <text x="160" y="48" class="lab">Best 3/4 face</text><text x="160" y="76" class="tag">RECOMMENDED</text></g>
  <g transform="translate(24,480)"><rect width="452" height="205" rx="10" class="body"/>
    <circle cx="90" cy="42" r="25" class="head"/><rect x="68" y="70" width="44" height="70" rx="16" class="torso"/>
    <line x1="77" y1="138" x2="68" y2="190" class="line"/><line x1="103" y1="138" x2="112" y2="190" class="line"/>
    <text x="160" y="60" class="lab">Full-body front</text><text x="160" y="88" class="tag">WHEN BODY IS NEEDED</text>
    <text x="160" y="118" class="small">Neutral stance · feet visible</text></g>
</g>

<g transform="translate(550,120)">
  <rect width="500" height="810" rx="12" class="col"/>
  <text x="24" y="42" class="ct">ADVANCED</text>
  <text x="24" y="68" class="small">Independent left/right non-frontal evidence</text>
  <g transform="translate(24,95)"><rect width="452" height="200" rx="10" class="req"/>
    <circle cx="85" cy="72" r="40" class="head"/><circle cx="225" cy="72" r="40" class="head"/><circle cx="365" cy="72" r="40" class="head"/>
    <text x="50" y="145" class="lab">Front</text><text x="180" y="145" class="lab">3/4 L</text><text x="320" y="145" class="lab">3/4 R</text>
    <text x="170" y="177" class="tag">REQUIRED SET</text></g>
  <g transform="translate(24,320)"><rect width="452" height="150" rx="10" class="rec"/>
    <circle cx="90" cy="60" r="38" class="head"/><text x="160" y="50" class="lab">At least one profile + smile</text><text x="160" y="78" class="tag">RECOMMENDED</text></g>
  <g transform="translate(24,495)"><rect width="452" height="205" rx="10" class="body"/>
    <circle cx="90" cy="42" r="25" class="head"/><rect x="68" y="70" width="44" height="70" rx="16" class="torso"/>
    <circle cx="225" cy="42" r="25" class="head"/><rect x="208" y="70" width="34" height="70" rx="14" class="torso"/>
    <text x="290" y="60" class="lab">Body front + side</text><text x="290" y="88" class="tag">WHEN BODY IS NEEDED</text></g>
</g>

<g transform="translate(1070,120)">
  <rect width="500" height="810" rx="12" class="col"/>
  <text x="24" y="42" class="ct">FULL</text>
  <text x="24" y="68" class="small">Broad observed multi-view evidence</text>
  <g transform="translate(24,95)"><rect width="452" height="225" rx="10" class="req"/>
    <circle cx="55" cy="62" r="32" class="head"/><circle cx="140" cy="62" r="32" class="head"/><circle cx="225" cy="62" r="32" class="head"/><circle cx="310" cy="62" r="32" class="head"/><circle cx="395" cy="62" r="32" class="head"/>
    <text x="35" y="122" class="small">Front</text><text x="115" y="122" class="small">3/4 L</text><text x="200" y="122" class="small">3/4 R</text><text x="285" y="122" class="small">Prof L</text><text x="372" y="122" class="small">Prof R</text>
    <text x="150" y="170" class="tag">REQUIRED / STRONGLY PREFERRED</text>
    <text x="55" y="200" class="small">Missing required side coverage → ask before generation</text></g>
  <g transform="translate(24,345)"><rect width="452" height="155" rx="10" class="rec"/>
    <text x="25" y="45" class="lab">Expressions · hair detail · hands/nails</text><text x="25" y="75" class="tag">RECOMMENDED / GOAL-CONDITIONAL</text>
    <text x="25" y="110" class="small">Neutral + smile · hairline · both hands if relevant</text></g>
  <g transform="translate(24,525)"><rect width="452" height="205" rx="10" class="body"/>
    <text x="25" y="42" class="lab">Body master references</text><text x="25" y="70" class="tag">WHEN BODY / POSE-READY OUTPUT IS NEEDED</text>
    <text x="25" y="108" class="small">Front · side · back (back required for canonical back)</text>
    <text x="25" y="138" class="small">Feet visible · neutral lens/perspective · neutral stance</text></g>
</g>
<text x="30" y="962" class="small">Important: photo count never replaces missing angle coverage. Exact height should be user-provided; do not infer it from ordinary photographs.</text>
</svg>