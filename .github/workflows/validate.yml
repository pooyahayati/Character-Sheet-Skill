name: Validate Skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python scripts
        run: python -m py_compile scripts/compose_sheet.py scripts/validate_repo.py scripts/package_skill.py
      - name: Validate schemas, examples, and contracts
        run: python scripts/validate_repo.py
      - name: Smoke-test deterministic compositor
        run: python scripts/compose_sheet.py examples/sample-sheet-manifest.json /tmp/character-sheet-demo.svg
      - name: Read Skill version
        id: version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Build installable Skill package
        run: python scripts/package_skill.py
      - name: Validate installable Skill package
        run: python scripts/package_skill.py --check "dist/character-sheet-skill-v${{ steps.version.outputs.version }}.zip"
      - name: Upload installable Skill package
        uses: actions/upload-artifact@v4
        with:
          name: character-sheet-skill-v${{ steps.version.outputs.version }}
          path: |
            dist/character-sheet-skill-v${{ steps.version.outputs.version }}.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
