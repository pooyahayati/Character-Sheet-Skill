name: Release Skill Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build installable skill ZIP
        run: python scripts/package_skill.py
      - name: Verify installable package
        run: python scripts/package_skill.py --check dist/character-sheet-skill-${{ github.ref_name }}.zip
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "dist/character-sheet-skill-${GITHUB_REF_NAME}.zip" \
              "dist/SHA256SUMS.txt" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "dist/character-sheet-skill-${GITHUB_REF_NAME}.zip" \
              "dist/SHA256SUMS.txt" \
              --title "Character Sheet Skill ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
